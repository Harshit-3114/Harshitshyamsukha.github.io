<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Harshit Shyamsukha</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Plus+Jakarta+Sans:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #f4eee3;
      --surface: #fdfbf7;
      --ink: #221c16;
      --ink-2: #574e44;
      --ink-3: #8b8175;
      --line: rgba(34, 28, 22, 0.12);
      --brass: #9a7526;
      --clay: #a8452a;
      --indigo: #3f3d8f;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Plus Jakarta Sans", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--canvas);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(50% 40% at 10% 10%, rgba(154, 117, 38, 0.14), transparent 62%),
        radial-gradient(45% 38% at 88% 16%, rgba(63, 61, 143, 0.12), transparent 60%),
        radial-gradient(60% 45% at 50% 106%, rgba(168, 69, 42, 0.10), transparent 64%);
    }
    .code {
      position: relative;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(6rem, 22vw, 15rem);
      line-height: 0.86;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, var(--brass) 0%, var(--clay) 38%, var(--indigo) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      position: relative;
      font-family: var(--font-display);
      font-weight: 300;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    p {
      position: relative;
      font-size: 1rem;
      color: var(--ink-2);
      max-width: 42ch;
      line-height: 1.7;
    }
    .rule {
      position: relative;
      width: 96px;
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--brass), var(--clay), var(--indigo));
    }
    .links {
      position: relative;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }
    a {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.85rem 1.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 220ms cubic-bezier(0.32, 0.72, 0, 1), background 220ms ease, border-color 220ms ease;
    }
    a:hover {
      transform: translateY(-3px);
      background: var(--ink);
      color: var(--canvas);
      border-color: var(--ink);
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: var(--brass);
      vertical-align: middle;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <span class="code">404</span>
  <span class="rule"></span>
  <h1>This page doesn't exist<span class="cursor"></span></h1>
  <p>But the work does. Let me take you somewhere useful.</p>
  <div class="links">
    <a href="/">← Home</a>
    <a href="/#work">Selected Work</a>
    <a href="https://github.com/Harshit-3114" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </div>
</body>
</html>
